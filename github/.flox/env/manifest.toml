#
# This is a Flox environment manifest.
# Visit flox.dev/docs/concepts/manifest/
# or see flox-edit(1), manifest.toml(5) for more information.
#
version = 1

[install]
# GitHub CLI and tools
gh.pkg-path = "gh"
gh.version = ">=2.40"

# GitHub Actions
act.pkg-path = "act"

# Git utilities
git.pkg-path = "git"
git-lfs.pkg-path = "git-lfs"
lazygit.pkg-path = "lazygit"
delta.pkg-path = "delta"
gum.pkg-path = "gum"

[vars]
# Git configuration defaults
GIT_PAGER = "delta --navigate"
GIT_EDITOR = "vim"

[hook]
on-activate = '''
# GitHub CLI environment bootstrap
bootstrap_github_config() {
    local config_file="$HOME/.config/flox/github-devops/session"
    local config_dir="$(dirname "$config_file")"

    # Check if GH_TOKEN is already set
    if [ -n "$GH_TOKEN" ]; then
        echo "GitHub token is already set as an environment variable."
        return 0
    fi

    # Check for existing session file
    if [ -f "$config_file" ]; then
        source "$config_file"
        if [ -n "$GH_TOKEN" ]; then
            echo "GitHub credentials loaded from session file."
            export GH_TOKEN
            return 0
        fi
    fi

    # Prompt for GitHub token
    mkdir -p "$config_dir"
    gum style --border double --margin "1 2" --padding "1 4" \
        "GitHub DevOps Environment Setup" \
        "" \
        "You need a GitHub Personal Access Token to use this environment."

    echo "Create a token at: https://github.com/settings/tokens"
    echo "Required scopes: repo, workflow, read:org"

    GH_TOKEN=$(gum input --password --header "GitHub Personal Access Token")

    # Persist token if user chooses
    if gum confirm "Persist token for future sessions?" --affirmative="Yes" --negative="No"; then
        cat > "$config_file" << SESSION
GH_TOKEN="$GH_TOKEN"
SESSION
        chmod 600 "$config_file"
        echo "Token saved to $config_file"
    else
        echo "Token will only be available for this session."
    fi

    export GH_TOKEN
    echo "GitHub token configured for this session."
}

if [[ "$FLOX_ENVS_TESTING" != "1" ]]; then
    bootstrap_github_config
fi

# Verify gh is authenticated
if [ -n "$GH_TOKEN" ] && ! gh auth status >/dev/null 2>&1; then
    echo "GitHub token found but not authenticated."
    echo "$GH_TOKEN" | gh auth login --with-token
fi
'''

[profile]
bash = '''
alias gs="git status"
alias gd="git diff | delta --navigate"
alias gl="git log --oneline -20"
alias gg="lazygit"
alias gaa="git add ."
alias gpr="gh pr create --web"
alias grun="gh run watch"
'''

zsh = '''
gs() { git status $@ }
gd() { git diff | delta --navigate $@ }
gl() { git log --oneline -20 $@ }
gg() { lazygit $@ }
gaa() { git add . $@ }
gpr() { gh pr create --web $@ }
grun() { gh run watch $@ }
'''

[options]
systems = ["aarch64-darwin", "aarch64-linux", "x86_64-darwin", "x86_64-linux"]
